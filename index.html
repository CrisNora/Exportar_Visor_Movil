<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visor móvil bodega</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f2f2f2;color:#111}
header{background:#202020;color:white;padding:12px}
h1{font-size:18px;margin:0}.sub{font-size:12px;margin-top:4px}
.tabs{display:flex;gap:6px;overflow:auto;padding:8px;background:#ddd}
.tabs button{border:1px solid #999;background:white;border-radius:8px;padding:8px 12px;font-weight:bold}
.tabs button.active{background:#202020;color:white}
.wrap{padding:8px}
.map{position:relative;background:#eee;border:1px solid #aaa;border-radius:10px;overflow:auto;height:58vh}
.canvas{position:relative;width:1700px;height:760px}
.dep{position:absolute;border:1.5px solid #333;border-radius:10px;text-align:center;font-weight:bold;font-size:11px;overflow:hidden;box-shadow:0 1px 3px #888;display:flex;align-items:center;justify-content:center;padding-left:18px;cursor:pointer}
.bar{position:absolute;left:4px;top:5px;width:11px;bottom:5px;background:white;border:1px solid #555}
.fill{position:absolute;left:1px;right:1px;bottom:1px}
.panel{background:white;margin-top:10px;border-radius:10px;padding:12px;border:1px solid #ccc}
.title{font-weight:bold;font-size:20px;margin-bottom:8px}
.ok{color:#0b6b0b}.warn{color:#9b0000}
.ficha{line-height:1.45;font-size:15px}
.box{border:1px solid #ddd;border-radius:8px;margin-top:8px;background:#f7f7f7}
.box summary{font-size:15px;font-weight:bold;padding:10px;background:#e9e9e9;border-radius:8px;cursor:pointer}
.item{background:white;border-left:5px solid #bbb;margin:8px;padding:8px;border-radius:6px;font-size:14px;line-height:1.35}
.mov{border-left-color:#2d7dd2}
.adi{border-left-color:#8a2be2}
.ana{border-left-color:#008060}
.hig{border-left-color:#78481e}
.warnitem{border-left-color:#d00000;background:#fff2cc;font-weight:bold}
.vacio{padding:10px;color:#777}
.error{background:#ffe0e0;border:1px solid red;padding:12px;border-radius:10px}

.mainnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;background:#202020}
.mainnav button{border:1px solid #777;background:white;border-radius:10px;padding:11px 8px;font-size:14px;font-weight:bold;cursor:pointer}
.mainnav button.active{background:#8a1c35;color:white;border-color:#8a1c35}
.vista{display:none}.vista.active{display:block}
.resumen-wrap{padding:8px}
.resumen-cabecera{background:white;border:1px solid #ccc;border-radius:10px;padding:12px;margin-bottom:8px}
.resumen-cabecera h2{font-size:20px;margin:0 0 8px 0}
.resumen-buscador{width:100%;box-sizing:border-box;border:1px solid #aaa;border-radius:8px;padding:10px;font-size:16px}
.resumen-contador{font-size:13px;color:#555;margin-top:7px}
.ana-row{background:white;border:1px solid #ccc;border-radius:10px;margin-bottom:8px;overflow:hidden}
.ana-row.alerta{border:2px solid #c00000;background:#ffebeb}
.ana-row summary{list-style:none;cursor:pointer;padding:12px;font-weight:bold;line-height:1.4}
.ana-row summary::-webkit-details-marker{display:none}
.ana-row summary:before{content:'▶';display:inline-block;margin-right:8px;font-size:12px}
.ana-row[open] summary:before{content:'▼'}
.ana-resumen-linea{display:block}
.ana-resumen-meta{display:block;font-weight:normal;font-size:13px;color:#555;margin-top:3px}
.ana-detalle{padding:0 10px 10px 10px}
.ana-lote{font-size:14px;margin:0 0 8px 2px}
.ana-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px}
.ana-celda{border:1px solid #ddd;border-radius:7px;padding:8px;background:#f8f8f8;min-height:48px;box-sizing:border-box}
.ana-campo{font-size:11px;color:#555;text-transform:uppercase;display:block;margin-bottom:3px}
.ana-valor{font-size:15px;word-break:break-word}
.sin-resumen{background:white;border:1px solid #ccc;border-radius:10px;padding:18px;line-height:1.45}
@media (max-width:520px){.ana-grid{grid-template-columns:1fr 1fr}.mainnav button{font-size:13px}}

/* FASE 2: historial simplificado y fermentación */
.historial-resumen{display:grid;gap:8px;padding:8px}
.hist-card{background:white;border:1px solid #ddd;border-radius:8px;padding:10px;line-height:1.45;font-size:14px}
.hist-card .muted{color:#666}
.ferm-panel{padding:10px}
.ferm-meta{background:#fafafa;border:1px solid #e3e3e3;border-radius:8px;padding:9px;line-height:1.4;font-size:14px;margin-bottom:8px}
.ferm-controls{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.ferm-controls button{border:1px solid #888;background:white;border-radius:8px;padding:7px 10px;font-weight:bold;cursor:pointer}
.ferm-controls button.active{background:#202020;color:white}
.ferm-chart{width:100%;overflow-x:auto;border:1px solid #ddd;border-radius:8px;background:white}
.ferm-chart svg{display:block;min-width:650px;width:100%;height:330px}
.ferm-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:8px 0;color:#444}
.ferm-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.ferm-eventos{margin-top:8px}
.ferm-evento{border-left:4px solid #8a2be2;background:#faf7ff;border-radius:6px;padding:7px;margin-top:6px;font-size:13px;line-height:1.35}
.ferm-evento.descube{border-left-color:#2d7dd2;background:#f4f9ff}
.ferm-sin{padding:12px;color:#666}

</style>
</head>
<body>

<header>
<h1>Visor móvil bodega</h1>
<div class="sub">Consulta generada desde Excel</div>
</header>

<div class="mainnav">
  <button id="btnPlano" class="active" type="button" onclick="mostrarVista('plano')">Plano de depósitos</button>
  <button id="btnResumen" type="button" onclick="mostrarVista('resumen')">Resumen de analíticas</button>
</div>

<section id="vistaPlano" class="vista active">
  <div class="tabs" id="tabs"></div>
  <div class="wrap">
    <div class="map">
      <div class="canvas" id="canvas"></div>
    </div>
    <div class="panel" id="info">Cargando datos...</div>
  </div>
</section>

<section id="vistaResumen" class="vista">
  <div class="resumen-wrap">
    <div class="resumen-cabecera">
      <h2>Resumen de analíticas</h2>
      <input id="filtroResumen" class="resumen-buscador" type="search" placeholder="Buscar depósito, lote o tipo de vino" oninput="renderResumenAnaliticas()">
      <div id="contadorResumen" class="resumen-contador"></div>
    </div>
    <div id="listaResumen"></div>
  </div>
</section>

<script>
let DEPOSITOS = {};
let MAPAS = [];
let MOVIMIENTOS = [];
let ADICIONES = [];
let ANALITICAS = [];
let AUDIT_REMANENTES = [];
let HIGIENE_DEPOSITOS = {};
let LIMPIEZAS_DEPOSITOS = [];
let RESUMEN_ANALITICAS = {columnas:[], filas:[]};
let FERMENTACIONES = {procesos:[], diario:[]};
let COLORES_TIPO_VINO = {};
let MODO_GRAFICO_FERM = {};
let mapaActual = 0;
let vistaActual = 'plano';


function mostrarVista(vista){
  vistaActual = vista === 'resumen' ? 'resumen' : 'plano';

  document.getElementById('vistaPlano').classList.toggle('active', vistaActual === 'plano');
  document.getElementById('vistaResumen').classList.toggle('active', vistaActual === 'resumen');
  document.getElementById('btnPlano').classList.toggle('active', vistaActual === 'plano');
  document.getElementById('btnResumen').classList.toggle('active', vistaActual === 'resumen');

  if(vistaActual === 'resumen'){
    renderResumenAnaliticas();
  }
}

function estiloCeldaAnalitica(celda){
  let estilos = [];

  if(celda && celda.fondo){
    estilos.push('background:'+String(celda.fondo));
  }

  if(celda && celda.color_texto){
    estilos.push('color:'+String(celda.color_texto));
  }

  if(celda && celda.negrita){
    estilos.push('font-weight:bold');
  }

  return estilos.join(';');
}

const ORDEN_FISICO_DEPOSITOS = {M:0,A:1,F:2,I:3,T:4,B:5,E:6};

function partesDepositoResumen(dep){
  let t = normalizarTexto(dep || '').replace(/\s+/g,'');
  let m = t.match(/^([A-Z]+)(\d+)?/);
  return {
    grupo: m ? m[1] : t,
    numero: m && m[2] ? Number(m[2]) : 999999,
    texto: t
  };
}

function compararDepositosResumen(depA,depB){
  let a = partesDepositoResumen(depA);
  let b = partesDepositoResumen(depB);
  let oa = Object.prototype.hasOwnProperty.call(ORDEN_FISICO_DEPOSITOS,a.grupo) ? ORDEN_FISICO_DEPOSITOS[a.grupo] : 99;
  let ob = Object.prototype.hasOwnProperty.call(ORDEN_FISICO_DEPOSITOS,b.grupo) ? ORDEN_FISICO_DEPOSITOS[b.grupo] : 99;
  if(oa !== ob) return oa-ob;
  if(a.grupo !== b.grupo) return a.grupo.localeCompare(b.grupo,'es');
  if(a.numero !== b.numero) return a.numero-b.numero;
  return a.texto.localeCompare(b.texto,'es',{numeric:true});
}

function renderResumenAnaliticas(){
  let contenedor = document.getElementById('listaResumen');
  let contador = document.getElementById('contadorResumen');

  if(!contenedor || !contador) return;

  let filas = (RESUMEN_ANALITICAS && Array.isArray(RESUMEN_ANALITICAS.filas))
    ? RESUMEN_ANALITICAS.filas.slice()
    : [];

  let filtro = normalizarTexto((document.getElementById('filtroResumen') || {}).value || '');

  if(filtro){
    filas = filas.filter(function(f){
      let texto = [f.deposito, f.lote, f.tipo, f.fecha]
        .concat((f.celdas || []).map(function(c){ return (c.campo || '')+' '+(c.valor || ''); }))
        .join(' ');
      return normalizarTexto(texto).includes(filtro);
    });
  }

  filas.sort(function(a,b){
    return compararDepositosResumen(a.deposito,b.deposito);
  });

  contador.textContent = filas.length + (filas.length === 1 ? ' depósito' : ' depósitos') +
    ((RESUMEN_ANALITICAS && RESUMEN_ANALITICAS.generado) ? ' | Actualizado: '+RESUMEN_ANALITICAS.generado : '');

  if(filas.length === 0){
    let tieneDatos = RESUMEN_ANALITICAS && Array.isArray(RESUMEN_ANALITICAS.filas) && RESUMEN_ANALITICAS.filas.length > 0;
    contenedor.innerHTML = tieneDatos
      ? '<div class="sin-resumen">No hay resultados con ese filtro.</div>'
      : '<div class="sin-resumen"><b>El resumen todavía no está incluido en datos.json.</b><br>Se cargará automáticamente cuando Excel publique el visor con la nueva macro.</div>';
    return;
  }

  contenedor.innerHTML = filas.map(function(f){
    let celdas = (f.celdas || []).filter(function(c){
      let campoNormal = normalizarTexto(c.campo || '').replace(/[_\s]/g,'');
      let tieneValor = String(c.valor === undefined || c.valor === null ? '' : c.valor).trim() !== '';
      let esCampoInterno = campoNormal === 'ORDENSISTEMA' || campoNormal === 'OBSERVACIONES';
      return tieneValor && !esCampoInterno;
    });

    let detalle = celdas.length > 0
      ? '<div class="ana-grid">' + celdas.map(function(c){
          return '<div class="ana-celda" style="'+esc(estiloCeldaAnalitica(c))+'">' +
            '<span class="ana-campo">'+esc(c.campo || '-')+'</span>' +
            '<span class="ana-valor">'+esc(c.valor || '-')+'</span>' +
            '</div>';
        }).join('') + '</div>'
      : '<div class="vacio">Sin analítica para el lote actual: <b>'+esc(f.lote || '-')+'</b>.</div>';

    return '<details class="ana-row'+(f.alerta ? ' alerta' : '')+'">' +
      '<summary>' +
        '<span class="ana-resumen-linea">'+esc(f.deposito || '-')+' | '+esc(f.tipo || '-')+' | '+fmt(f.volumen)+' L</span>' +
        '<span class="ana-resumen-meta">Fecha usada: '+esc(f.fecha || '-')+(f.alerta ? ' | AVISO DEL EXCEL' : '')+'</span>' +
      '</summary>' +
      '<div class="ana-detalle">' +
        '<div class="ana-lote"><b>Lote actual:</b> '+esc(f.lote || '-')+'</div>' +
        detalle +
      '</div>' +
    '</details>';
  }).join('');
}

function fmt(n){
  return Math.round(Number(n || 0)).toLocaleString('es-ES');
}

function normalizarTexto(x){
  let t = String(x || '').toUpperCase();
  t = t.replace(/Á/g,'A').replace(/É/g,'E').replace(/Í/g,'I').replace(/Ó/g,'O').replace(/Ú/g,'U').replace(/Ü/g,'U');
  return t;
}

function normalizarClaveTipo(x){
  return normalizarTexto(String(x || '').replace(/\u00a0/g,' ')).trim().replace(/\s+/g,' ');
}

function colorLogicoDep(d){
  if(!d || Number(d.volumen || 0) <= 0) return 'VACIO';

  let clave = normalizarClaveTipo(d.tipo || '');
  let desdeTabla = clave && Object.prototype.hasOwnProperty.call(COLORES_TIPO_VINO,clave)
    ? COLORES_TIPO_VINO[clave]
    : '';

  let color = normalizarTexto(desdeTabla || d.color || '').trim();

  if(color === 'TINTO' || color === 'BLANCO' || color === 'ROSADO') return color;
  return 'SIN CLASIFICAR';
}

function colorDep(d){
  let color = colorLogicoDep(d);
  if(color === 'VACIO') return '#f5f5f5';
  if(color === 'TINTO') return '#dc0000';
  if(color === 'BLANCO') return '#ffe650';
  if(color === 'ROSADO') return '#f4aac8';
  return '#aaa';
}

function colorHigiene(h){
  let t = normalizarTexto((h && (h.texto || h.estado)) || '');

  if(t.includes('SOSA')) return '#7030a0';
  if(t.includes('SOLO TINTO')) return '#78481e';
  if(t.includes('DESINF')) return '#1f4e79';
  if(t.includes('REVISAR')) return '#808080';
  if(t.includes('APTO')) return '#000000';

  return '#000000';
}

function textoHigiene(h){
  if(!h) return '';

  if(h.texto){
    return String(h.texto);
  }

  let e = normalizarTexto(h.estado || '');

  if(e.includes('SOSA')) return 'SOSA';
  if(e.includes('SOLO TINTO')) return 'SOLO TINTO';
  if(e.includes('DESINF')) return 'DESINF.';
  if(e.includes('REVISAR')) return 'REVISAR';
  if(e.includes('APTO')) return 'APTO';

  return '';
}

function higieneDep(dep,d){
  let buscado = String(dep || '').toUpperCase();

  if(HIGIENE_DEPOSITOS[dep]){
    return HIGIENE_DEPOSITOS[dep];
  }

  if(HIGIENE_DEPOSITOS[buscado]){
    return HIGIENE_DEPOSITOS[buscado];
  }

  for(let k in HIGIENE_DEPOSITOS){
    if(Object.prototype.hasOwnProperty.call(HIGIENE_DEPOSITOS,k)){
      if(String(k || '').toUpperCase() === buscado){
        return HIGIENE_DEPOSITOS[k];
      }
    }
  }

  if(d && d.higiene){
    return d.higiene;
  }

  return null;
}

function textColor(d,h){
  if(d && colorLogicoDep(d) === 'TINTO' && Number(d.volumen || 0) > 0){
    return 'white';
  }

  if(Number((d && d.volumen) || 0) <= 0 && h){
    return colorHigiene(h);
  }

  return 'black';
}

function esc(x){
  return String(x || '').replace(/[&<>]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];
  });
}

function detalleBonito(t){
  return esc(t).replace(/\s*\|\s*/g,'<br>').replace(/=/g,': ');
}

function bloque(titulo,contenido){
  return '<details class="box"><summary>'+titulo+'</summary>'+contenido+'</details>';
}

function valorFecha(f){
  let s = String(f || '').trim();

  if(!s) return 0;

  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){
    return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1])).getTime();
  }

  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m){
    return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getTime();
  }

  let t = Date.parse(s);
  return isNaN(t) ? 0 : t;
}

function numeroOrdenRegistro(x, indiceOriginal){
  if(!x) return indiceOriginal || 0;

  let posibles = [
    x.orden_sistema,
    x.Orden_Sistema,
    x.ORDEN_SISTEMA,
    x.orden,
    x.Orden,
    x.id,
    x.ID,
    x.Id
  ];

  for(let i = 0; i < posibles.length; i++){
    let v = posibles[i];

    if(v !== undefined && v !== null && String(v).trim() !== ''){
      let n = Number(String(v).replace(/\./g,'').replace(',','.'));
      if(!isNaN(n)) return n;
    }
  }

  let detalle = String(x.detalle || '');

  let m = detalle.match(/Orden[_\s]*Sistema\s*[:=]\s*([0-9.,]+)/i);
  if(m && m[1]){
    let n = Number(String(m[1]).replace(/\./g,'').replace(',','.'));
    if(!isNaN(n)) return n;
  }

  return indiceOriginal || 0;
}

function ordenarFechaDesc(lista){
  return (lista || [])
    .map(function(x,i){
      return {
        item: x,
        indice: i
      };
    })
    .sort(function(a,b){
      let fa = valorFecha(a.item.fecha);
      let fb = valorFecha(b.item.fecha);

      if(fb !== fa){
        return fb - fa;
      }

      let oa = numeroOrdenRegistro(a.item, a.indice);
      let ob = numeroOrdenRegistro(b.item, b.indice);

      if(ob !== oa){
        return ob - oa;
      }

      return b.indice - a.indice;
    })
    .map(function(x){
      return x.item;
    });
}

function pintarLista(lista,clase){
  let salida = ordenarFechaDesc(lista);

  if(!salida || salida.length === 0){
    return '<div class="vacio">Sin datos</div>';
  }

  return salida.map(function(x){
    let f = x.fecha ? '<b>'+esc(x.fecha)+'</b><br>' : '';
    return '<div class="item '+clase+'">'+f+detalleBonito(x.detalle || '')+'</div>';
  }).join('');
}

function campo(x,nombres){
  if(!x) return '';

  for(let i=0;i<nombres.length;i++){
    let n = nombres[i];

    if(x[n] !== undefined && x[n] !== null && String(x[n]).trim() !== ''){
      return String(x[n]).trim();
    }
  }

  let buscados = nombres.map(function(n){
    return normalizarTexto(n).replace(/_/g,'');
  });

  for(let k in x){
    if(Object.prototype.hasOwnProperty.call(x,k)){
      let nk = normalizarTexto(k).replace(/_/g,'');

      if(buscados.includes(nk)){
        if(x[k] !== undefined && x[k] !== null && String(x[k]).trim() !== ''){
          return String(x[k]).trim();
        }
      }
    }
  }

  return '';
}

function campoDetalle(x,nombres){
  let detalle = String((x && x.detalle) || '');

  if(!detalle) return '';

  for(let i=0;i<nombres.length;i++){
    let n = nombres[i];

    let patrones = [
      n,
      n.replace(/_/g,' '),
      n.replace(/ /g,'_')
    ];

    for(let j=0;j<patrones.length;j++){
      let p = patrones[j].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      let re = new RegExp(p + '\\s*[:=]\\s*([^|\\n\\r]+)', 'i');
      let m = detalle.match(re);

      if(m && m[1]){
        return String(m[1]).trim();
      }
    }
  }

  return '';
}

function loteOrigenMovimiento(x,loteActual){
  let directo = campo(x,[
    'lote_origen_momento',
    'Lote_Origen_Momento',
    'lote_origen',
    'Lote_Origen',
    'lote_anterior',
    'Lote_Anterior'
  ]);

  if(directo) return directo;

  let desdeDetalle = campoDetalle(x,[
    'Lote_Origen_Momento',
    'Lote Origen Momento',
    'Lote_Origen',
    'Lote Origen',
    'Lote_Anterior',
    'Lote Anterior'
  ]);

  if(desdeDetalle) return desdeDetalle;

  let lote = campo(x,['lote','Lote']);

  if(lote && lote !== loteActual){
    return lote;
  }

  return loteActual;
}

function renderTabs(){
  let t = document.getElementById('tabs');
  t.innerHTML = '';

  MAPAS.forEach(function(m,i){
    let b = document.createElement('button');
    b.textContent = m.nombre;
    b.className = i === mapaActual ? 'active' : '';
    b.onclick = function(){
      mapaActual = i;
      render();
    };
    t.appendChild(b);
  });
}

function render(){
  renderTabs();

  let c = document.getElementById('canvas');
  c.innerHTML = '';

  if(!MAPAS || MAPAS.length === 0){
    document.getElementById('info').innerHTML = '<div class="error">No hay mapas cargados en datos.json.</div>';
    return;
  }

  let maxX = 1200;
  let maxY = 600;

  MAPAS[mapaActual].deps.forEach(function(p){
    maxX = Math.max(maxX, Number(p.x) + Number(p.w) + 80);
    maxY = Math.max(maxY, Number(p.y) + Number(p.h) + 80);

    let d = DEPOSITOS[p.dep] || {
      dep:p.dep,
      volumen:0,
      capacidad:0,
      tipo:'',
      estado:'',
      lote:'',
      fecha:'',
      color:'VACIO'
    };

    let h = higieneDep(p.dep,d);

    let e = document.createElement('div');
    e.className = 'dep';
    e.style.left = p.x + 'px';
    e.style.top = p.y + 'px';
    e.style.width = p.w + 'px';
    e.style.height = p.h + 'px';
    e.style.background = colorDep(d);
    e.style.color = textColor(d,h);

    let ratio = d.capacidad > 0 ? Math.max(0,Math.min(1,d.volumen/d.capacidad)) : 0;

    let textoCentral = Number(d.volumen || 0) > 0
      ? esc(d.tipo || 'SIN CLASIFICAR')
      : esc(textoHigiene(h) || 'VACIO');

    let textoExtra = '';

    if(Number(d.volumen || 0) > 0 && d.estado){
      textoExtra = '<br>'+esc(d.estado);
    }

    if(Number(d.volumen || 0) <= 0 && !h && d.estado){
      textoExtra = '<br>'+esc(d.estado);
    }

    e.innerHTML =
      '<div class="bar"><div class="fill" style="height:'+(ratio*100)+'%;background:'+colorDep(d)+'"></div></div>' +
      '<div>' +
      esc(p.label || p.dep) + '<br>' +
      fmt(d.volumen) + ' / ' + fmt(d.capacidad) + ' L<br>' +
      textoCentral +
      textoExtra +
      '</div>';

    e.onclick = function(){
      showDep(p.dep,d);
    };

    c.appendChild(e);
  });

  c.style.width = maxX + 'px';
  c.style.height = maxY + 'px';
}

function perteneceLote(x,lote){
  if(!lote) return false;

  let valores = [
    campo(x,['lote','Lote']),
    campo(x,['lote_resultante','Lote_Resultante']),
    campo(x,['lote_origen','Lote_Origen']),
    campo(x,['lote_origen_momento','Lote_Origen_Momento']),
    campoDetalle(x,['Lote_Resultante','Lote_Origen','Lote_Origen_Momento'])
  ];

  if(valores.some(function(v){ return String(v || '') === String(lote || ''); })){
    return true;
  }

  return String(x.detalle || '').includes(lote);
}

function normalizarDep(x){
  let t = String(x || '').trim().toUpperCase();

  t = t.replace(/^ACTUAL\s*:\s*/i,'');
  t = t.replace(/^ORIGEN\s*:\s*/i,'');
  t = t.replace(/^DESTINO\s*:\s*/i,'');
  t = t.replace(/^DEP[ÓO]SITO\s*:\s*/i,'');
  t = t.replace(/^DEPOSITO\s*:\s*/i,'');

  return t.trim();
}

function depositoMovimiento(x){
  let valores = [
    campo(x,['dep','Dep','deposito','Deposito','depósito','Depósito']),
    campo(x,['origen','Origen']),
    campo(x,['destino','Destino']),
    campoDetalle(x,['Depósito','Deposito','Dep','Actual','Origen','Destino'])
  ];

  for(let i = 0; i < valores.length; i++){
    if(String(valores[i] || '').trim() !== ''){
      return normalizarDep(valores[i]);
    }
  }

  return '';
}

function origenMovimiento(x){
  return normalizarDep(
    campo(x,['origen','Origen']) ||
    campoDetalle(x,['Origen'])
  );
}

function destinoMovimiento(x){
  return normalizarDep(
    campo(x,['destino','Destino']) ||
    campoDetalle(x,['Destino'])
  );
}

function tipoMovimientoVisor(x){
  let valores = [
    campo(x,['evento','Evento']),
    campo(x,['tipo','Tipo']),
    campo(x,['tipo_movimiento','Tipo_Movimiento']),
    campo(x,['movimiento','Movimiento']),
    campo(x,['operacion','Operacion','operación','Operación']),
    campo(x,['accion','Accion','acción','Acción']),
    campoDetalle(x,['Evento','Tipo','Tipo_Movimiento','Movimiento','Operacion','Operación','Accion','Acción']),
    x && x.detalle ? x.detalle : ''
  ];

  return normalizarTexto(valores.join(' '));
}

function litrosMovimiento(x){
  let v =
    campo(x,['litros','Litros','volumen','Volumen','cantidad','Cantidad']) ||
    campoDetalle(x,['Litros','Volumen','Cantidad']);

  v = String(v || '0')
    .replace(/\./g,'')
    .replace(',','.');

  let n = Number(v);

  return isNaN(n) ? 0 : n;
}

function esSalidaMovimiento(x){
  let t = tipoMovimientoVisor(x);

  if(t.includes('SALIDA_CLIENTE')) return true;
  if(t.includes('SALIDA CLIENTE')) return true;
  if(t.includes('CLIENTE')) return true;
  if(t.includes('EMBOTELLADO')) return true;
  if(t.includes('ENVIO')) return true;
  if(t.includes('ENVÍO')) return true;
  if(t.includes('CARGA')) return true;
  if(t.includes('SALIDA')) return true;

  if(t.includes('MERMA')){
    return litrosMovimiento(x) < 0;
  }

  return false;
}

function esEntradaMovimiento(x){
  let t = tipoMovimientoVisor(x);

  if(t.includes('ENTRADA')) return true;
  if(t.includes('RECEPCION')) return true;
  if(t.includes('RECEPCIÓN')) return true;
  if(t.includes('RECEPCION_BODEGA')) return true;
  if(t.includes('RECEPCIÓN_BODEGA')) return true;

  if(t.includes('MERMA')){
    return litrosMovimiento(x) > 0;
  }

  return false;
}

function movimientoPerteneceADeposito(x,dep){
  let depBuscado = normalizarDep(dep);

  let posibles = [
    depositoMovimiento(x),
    origenMovimiento(x),
    destinoMovimiento(x),
    normalizarDep(campo(x,['dep','Dep'])),
    normalizarDep(campo(x,['deposito','Deposito','depósito','Depósito'])),
    normalizarDep(campoDetalle(x,['Depósito','Deposito','Actual','Origen','Destino']))
  ];

  return posibles.some(function(v){
    return v && v === depBuscado;
  });
}

function eventosNodo(dep,lote){
  let depBuscado = normalizarDep(dep);

  let entradas = MOVIMIENTOS.filter(function(x){
    if(!perteneceLote(x,lote)) return false;

    let destino = destinoMovimiento(x);

    if(destino && destino === depBuscado) return true;

    return movimientoPerteneceADeposito(x,depBuscado) && esEntradaMovimiento(x);
  });

  let salidas = MOVIMIENTOS.filter(function(x){
    if(!perteneceLote(x,lote)) return false;

    let origen = origenMovimiento(x);

    if(origen && origen === depBuscado) return true;

    return movimientoPerteneceADeposito(x,depBuscado) && esSalidaMovimiento(x);
  });

  let adis = ADICIONES.filter(function(x){
    return normalizarDep(x.dep) === depBuscado && perteneceLote(x,lote);
  });

  let anas = ANALITICAS.filter(function(x){
    return normalizarDep(x.dep) === depBuscado && perteneceLote(x,lote);
  });

  return {
    entradas: entradas,
    salidas: salidas,
    adis: adis,
    anas: anas
  };
}

function textoMovimiento(x){
  let partes = [];

  ['tipo','tipo_movimiento','movimiento','operacion','accion','detalle'].forEach(function(k){
    if(x && x[k]) partes.push(String(x[k]));
  });

  return partes.join(' ').toLowerCase();
}

function esMezcla(x){
  let t = textoMovimiento(x);
  return t.includes('mezcla') || t.includes('mix');
}

function claveAnalitica(x){
  return String(x.dep || '') + '|' +
         String(x.fecha || '') + '|' +
         String(x.lote || '') + '|' +
         String(x.detalle || '');
}

function ultimaAnaliticaDeDeposito(dep,lote){
  let depBuscado = String(dep || '').trim();

  if(!depBuscado) return null;

  let listaMismoLote = ANALITICAS.filter(function(a){
    return String(a.dep || '').trim() === depBuscado && perteneceLote(a,lote);
  });

  let encontrada = ordenarFechaDesc(listaMismoLote)[0] || null;

  if(encontrada){
    return encontrada;
  }

  let listaSoloDeposito = ANALITICAS.filter(function(a){
    return String(a.dep || '').trim() === depBuscado;
  });

  return ordenarFechaDesc(listaSoloDeposito)[0] || null;
}

function normalizarSiNo(x){
  let t = normalizarTexto(x || '').trim();
  return t === 'SI' || t === 'SÍ' || t === 'TRUE' || t === 'VERDADERO' || t === '1';
}

function fechaComparable(f){
  return String(f || '').trim();
}

function numeroParecido(a,b){
  a = Math.abs(Number(String(a || '0').replace(/\./g,'').replace(',','.')));
  b = Math.abs(Number(String(b || '0').replace(/\./g,'').replace(',','.')));

  if(isNaN(a) || isNaN(b)) return false;

  return Math.abs(a - b) <= 1;
}

function buscarAvisoRemanente(depDestino, depOrigen, fecha, litros, loteActual){
  depDestino = normalizarDep(depDestino);
  depOrigen = normalizarDep(depOrigen);
  fecha = fechaComparable(fecha);

  let candidatos = AUDIT_REMANENTES.filter(function(a){
    let d = normalizarDep(
      campo(a,['dep_destino','Dep_Destino','Dep_Desti','destino','Destino']) ||
      campoDetalle(a,['Dep_Destino','Dep Destino','Destino'])
    );

    if(d !== depDestino) return false;

    let bloquea =
      campo(a,['bloquear_herencia_analitica','Bloquear_Herencia_Analitica']) ||
      campoDetalle(a,['Bloquear_Herencia_Analitica','Bloquear Herencia Analitica']);

    let mezcla =
      campo(a,['mezcla_con_remanente','Mezcla_Con_Remanente']) ||
      campoDetalle(a,['Mezcla_Con_Remanente','Mezcla Con Remanente']);

    if(!normalizarSiNo(bloquea) && !normalizarSiNo(mezcla)) return false;

    let f = fechaComparable(campo(a,['fecha','Fecha']) || campoDetalle(a,['Fecha']));

    if(fecha && f && f !== fecha) return false;

    let o = normalizarDep(
      campo(a,['dep_origen','Dep_Origen','Dep_Orig','origen','Origen']) ||
      campoDetalle(a,['Dep_Origen','Dep Origen','Origen'])
    );

    if(depOrigen && o && o !== depOrigen) return false;

    let litrosAudit =
      campo(a,['litros_entrada','Litros_Entrada','volumen_l','Volumen_L']) ||
      campoDetalle(a,['Litros_Entrada','Litros Entrada','Volumen_L','Volumen']);

    if(litros && litrosAudit && !numeroParecido(litrosAudit, litros)) return false;

    return true;
  });

  if(candidatos.length === 0){
    return null;
  }

  return candidatos[0];
}

function textoAvisoRemanente(a){
  if(!a) return '';

  let depD =
    campo(a,['dep_destino','Dep_Destino','Dep_Desti','destino','Destino']) ||
    campoDetalle(a,['Dep_Destino','Dep Destino','Destino']);

  let depO =
    campo(a,['dep_origen','Dep_Origen','Dep_Orig','origen','Origen']) ||
    campoDetalle(a,['Dep_Origen','Dep Origen','Origen']);

  let litrosEntrada =
    campo(a,['litros_entrada','Litros_Entrada','volumen_l','Volumen_L']) ||
    campoDetalle(a,['Litros_Entrada','Litros Entrada','Volumen_L','Volumen']);

  let volAntes =
    campo(a,['vol_destino_antes_l','Vol_Destino_Antes_L','vol_destino_antes','Vol_Destino_Antes']) ||
    campoDetalle(a,['Vol_Destino_Antes_L','Vol Destino Antes L','Vol_Destino_Antes']);

  let loteAntes =
    campo(a,['lote_destino_antes','Lote_Destino_Antes','lote_destino_ant','Lote_Destino_Ant']) ||
    campoDetalle(a,['Lote_Destino_Antes','Lote Destino Antes']);

  let tipoAntes =
    campo(a,['tipo_destino_antes','Tipo_Destino_Antes']) ||
    campoDetalle(a,['Tipo_Destino_Antes','Tipo Destino Antes']);

  let nota =
    campo(a,['nota_arbol_visor','Nota_Arbol_Visor','motivo','Motivo']) ||
    campoDetalle(a,['Nota_Arbol_Visor','Motivo']);

  let partes = [];

  partes.push('MEZCLA CON REMANENTE EN DESTINO');

  if(depD || volAntes){
    partes.push((depD || 'El destino') + ' ya tenía ' + (volAntes || '?') + ' L antes de recibir vino');
  }

  if(depO || litrosEntrada){
    partes.push('Entrada desde ' + (depO || '?') + ': ' + (litrosEntrada || '?') + ' L');
  }

  if(loteAntes){
    partes.push('Lote previo en destino: ' + loteAntes);
  }

  if(tipoAntes){
    partes.push('Tipo previo en destino: ' + tipoAntes);
  }

  partes.push('NO heredar analítica automáticamente');

  if(nota){
    partes.push(nota);
  }

  return partes.join(' | ');
}

function avisosRemanenteNodo(dep,lote,ev){
  let depBuscado = normalizarDep(dep);
  let avisos = [];
  let vistos = {};

  (ev.entradas || []).forEach(function(m){
    let origen = origenMovimiento(m);
    let destino = destinoMovimiento(m);

    if(destino && destino !== depBuscado) return;

    let fechaM = String(m.fecha || '').trim();
    let litrosM = Math.abs(litrosMovimiento(m));

    let aviso = buscarAvisoRemanente(depBuscado, origen, fechaM, litrosM, lote);

    if(!aviso) return;

    let clave = [
      campo(aviso,['fecha','Fecha']),
      campo(aviso,['fila_trasiego','Fila_Trasiego']),
      campo(aviso,['dep_origen','Dep_Origen']),
      campo(aviso,['dep_destino','Dep_Destino']),
      campo(aviso,['litros_entrada','Litros_Entrada'])
    ].join('|');

    if(vistos[clave]) return;

    vistos[clave] = true;
    avisos.push({
      fecha: campo(aviso,['fecha','Fecha']) || fechaM,
      detalle: textoAvisoRemanente(aviso)
    });
  });

  return avisos;
}

function tieneBloqueoHerenciaPorRemanente(dep,lote,ev){
  let depBuscado = normalizarDep(dep);

  let entradas = (ev && ev.entradas) ? ev.entradas : [];

  for(let i = 0; i < entradas.length; i++){
    let m = entradas[i];

    let origen = origenMovimiento(m);
    let destino = destinoMovimiento(m);

    if(destino && destino !== depBuscado) continue;

    let fechaM = String(m.fecha || '').trim();
    let litrosM = Math.abs(litrosMovimiento(m));

    let aviso = buscarAvisoRemanente(depBuscado, origen, fechaM, litrosM, lote);

    if(aviso){
      return true;
    }
  }

  return false;
}

function loteResultanteMovimiento(m){
  return campo(m,[
    'lote_resultante',
    'Lote_Resultante',
    'lote_resultante_fila',
    'Lote_Resultante_Fila'
  ]) || campoDetalle(m,[
    'Lote_Resultante',
    'Lote Resultante',
    'Lote_Resultante_Fila',
    'Lote Resultante Fila'
  ]);
}

function trasiegoPermiteHeredarAnalitica(m, dep, loteActual){
  let origen = String(m.origen || '').trim();

  if(!origen) return false;
  if(origen === String(dep || '').trim()) return false;

  let loteOrigen = loteOrigenMovimiento(m,loteActual);
  let loteResultante = loteResultanteMovimiento(m);

  // Regla principal:
  // si el lote origen no es el mismo que el lote actual, NO se hereda analítica.
  if(loteOrigen && loteActual && String(loteOrigen) !== String(loteActual)){
    return false;
  }

  // Si la fila trae lote resultante y no coincide con el lote actual, tampoco.
  if(loteResultante && loteActual && String(loteResultante) !== String(loteActual)){
    return false;
  }

  // Si M40 dice que hay remanente o mezcla, NO se hereda.
  let depBuscado = normalizarDep(dep);
  let origenBuscado = origenMovimiento(m);
  let destinoBuscado = destinoMovimiento(m);
  let fechaM = String(m.fecha || '').trim();
  let litrosM = Math.abs(litrosMovimiento(m));

  if(destinoBuscado && destinoBuscado !== depBuscado){
    return false;
  }

  let aviso = buscarAvisoRemanente(depBuscado, origenBuscado, fechaM, litrosM, loteActual);

  if(aviso){
    return false;
  }

  return true;
}

function analiticasConDepositoAnterior(dep,lote,ev){
  let anas = (ev.anas || []).slice();
  let yaIncluidas = {};

  anas.forEach(function(a){
    yaIncluidas[claveAnalitica(a)] = true;
  });

  (ev.entradas || []).forEach(function(m){

    if(!trasiegoPermiteHeredarAnalitica(m, dep, lote)){
      return;
    }

    let origen = String(m.origen || '').trim();
    let loteAnterior = loteOrigenMovimiento(m,lote);

    let anaAnterior =
      ultimaAnaliticaDeDeposito(origen,loteAnterior) ||
      ultimaAnaliticaDeDeposito(origen,lote) ||
      ultimaAnaliticaDeDeposito(origen,'');

    if(!anaAnterior) return;

    let claveOriginal = claveAnalitica(anaAnterior);

    if(yaIncluidas[claveOriginal]) return;

    let copia = {};

    for(let k in anaAnterior){
      if(Object.prototype.hasOwnProperty.call(anaAnterior,k)){
        copia[k] = anaAnterior[k];
      }
    }

    copia.detalle =
      'ANALÍTICA HEREDADA DEL DEPÓSITO ANTERIOR: ' + origen +
      ' | Lote origen: ' + loteAnterior +
      ' | ' +
      (anaAnterior.detalle || '');

    copia.es_heredada = true;

    yaIncluidas[claveOriginal] = true;
    anas.push(copia);
  });

  return anas;
}
function construirArbol(dep,lote,nivel,visitados){
  let clave = dep + '|' + lote;

  if(visitados[clave]){
    return '<div class="item mov">↳ '+esc(dep)+' / '+esc(lote)+' ya visitado</div>';
  }

  visitados[clave] = true;

  let ev = eventosNodo(dep,lote);
  let avisosRemanente = avisosRemanenteNodo(dep,lote,ev);
  let anasVisor = analiticasConDepositoAnterior(dep,lote,ev);

  let abierto = nivel === 0 ? ' open' : '';

  let html = '<details class="box"' + abierto + '>' +
    '<summary>'+('&nbsp;&nbsp;'.repeat(nivel))+'DEPÓSITO '+esc(dep)+' | Lote '+esc(lote || '-')+'</summary>';

  html += bloque('Entradas', pintarLista(ev.entradas,'mov'));

  if(avisosRemanente.length > 0){
    html += bloque('Mezclas con remanente / avisos', pintarLista(avisosRemanente,'warnitem'));
  }

  html += bloque('Salidas', pintarLista(ev.salidas,'mov'));
  html += bloque('Adiciones', pintarLista(ev.adis,'adi'));
  html += bloque('Analíticas', pintarLista(anasVisor,'ana'));

  let padres = ev.entradas
    .filter(x => x.origen && x.origen !== dep)
    .map(x => ({
      dep:x.origen,
      lote:loteOrigenMovimiento(x,lote)
    }));

  let unicos = {};
  padres.forEach(p => unicos[p.dep + '|' + p.lote] = p);

  let listaPadres = Object.values(unicos);

  if(listaPadres.length > 0){
    html += '<details class="box"><summary>Padres anteriores</summary>';

    listaPadres.forEach(p => {
      html += construirArbol(p.dep,p.lote,nivel+1,visitados);
    });

    html += '</details>';
  }

  html += '</details>';

  return html;
}


function fechaOrden(x){
  return valorFecha((x && (x.fecha || x.fecha_registro || x.Fecha)) || '');
}

function ultimoRegistroLimpieza(dep){
  let buscado=normalizarDep(dep);
  return (LIMPIEZAS_DEPOSITOS || [])
    .filter(function(x){return normalizarDep(x.dep || x.deposito)===buscado;})
    .sort(function(a,b){return fechaOrden(b)-fechaOrden(a);})[0] || null;
}

function ultimoContenidoDeposito(dep,d){
  let reg=ultimoRegistroLimpieza(dep);
  if(reg){
    let tipo=campo(reg,['ultimo_contenido','contenido_anterior','tipo_vino','Tipo_Vino']);
    let lote=campo(reg,['lote_anterior','Lote_Anterior','lote','Lote']);
    let volumen=campo(reg,['volumen','Volumen','volumen_anterior','Volumen_Anterior']);
    if(tipo || lote || volumen){
      return {tipo:tipo,lote:lote,volumen:volumen,fecha:reg.fecha || '',origen:'limpieza'};
    }
  }

  let actual=String((d && d.lote) || '');
  let candidatos=(MOVIMIENTOS || []).filter(function(x){
    let o=origenMovimiento(x);
    if(o!==normalizarDep(dep)) return false;
    let l=loteOrigenMovimiento(x,actual);
    return !actual || !l || String(l)!==actual;
  });
  let mov=ordenarFechaDesc(candidatos)[0] || null;
  if(!mov) return null;
  return {
    tipo:campo(mov,['tipo_vino','Tipo_Vino']) || campoDetalle(mov,['Tipo_Origen_Momento','Tipo Vino']),
    lote:loteOrigenMovimiento(mov,actual),
    volumen:Math.abs(litrosMovimiento(mov)) || '',
    fecha:mov.fecha || '',
    origen:'movimiento'
  };
}

function fichaUltimoContenido(dep,d){
  let u=ultimoContenidoDeposito(dep,d);
  if(!u) return '<div class="vacio">Sin contenido anterior localizado.</div>';
  let vol=String(u.volumen || '').trim();
  if(vol && !isNaN(Number(String(vol).replace(/\./g,'').replace(',','.')))){
    vol=fmt(Number(String(vol).replace(/\./g,'').replace(',','.')))+' L';
  }
  return '<div class="historial-resumen"><div class="hist-card">'+
    '<b>Producto anterior:</b> '+esc(u.tipo || '-')+'<br>'+
    '<b>Lote anterior:</b> '+esc(u.lote || '-')+'<br>'+
    '<b>Volumen:</b> '+esc(vol || '-')+'<br>'+
    '<b>Fecha de vaciado/registro:</b> '+esc(u.fecha || '-')+
    '</div></div>';
}

function fichaHigieneSimplificada(dep,d){
  let h=higieneDep(dep,d);
  let hist=(LIMPIEZAS_DEPOSITOS || []).filter(function(x){
    return normalizarDep(x.dep || x.deposito)===normalizarDep(dep);
  });
  let actual=h ? '<div class="hist-card">'+
    '<b>Estado:</b> '+esc(h.estado || h.texto || '-')+'<br>'+
    '<b>Última limpieza:</b> '+esc(h.tipo_limpieza || '-')+'<br>'+
    '<b>Fecha:</b> '+esc(h.fecha || '-')+'<br>'+
    '<b>Realizado por:</b> '+esc(h.realizado_por || h.operario || '-')+'<br>'+
    '<b>Registrado por:</b> '+esc(h.registrado_por || '-')+'<br>'+
    '<b>Apto para:</b> '+esc(h.apto_para || h.aptitud || '-')+'<br>'+
    '<b>Observaciones:</b> '+esc(h.observaciones || h.incidencia || '-')+
    '</div>' : '<div class="vacio">Sin estado de higiene registrado.</div>';
  return '<div class="historial-resumen">'+actual+'</div>'+bloque('Historial de higiene',pintarLista(hist,'hig'));
}

function bloqueHistorialDeposito(dep,d){
  let contenido='';
  contenido += bloque('Último contenido',fichaUltimoContenido(dep,d));
  contenido += bloque('Higiene',fichaHigieneSimplificada(dep,d));
  return bloque('Historial del depósito',contenido);
}

function procesoPorDeposito(dep,lote){
  let procesos=(FERMENTACIONES && Array.isArray(FERMENTACIONES.procesos)) ? FERMENTACIONES.procesos : [];
  let exactos=procesos.filter(function(p){
    return normalizarDep(p.deposito_actual)===normalizarDep(dep) && (!lote || String(p.lote_actual || '')===String(lote));
  });
  exactos.sort(function(a,b){
    let ea=normalizarTexto(a.estado)==='ACTIVO' ? 1 : 0;
    let eb=normalizarTexto(b.estado)==='ACTIVO' ? 1 : 0;
    if(eb!==ea) return eb-ea;
    return valorFecha(b.fecha_inicio)-valorFecha(a.fecha_inicio);
  });
  if(exactos[0]) return exactos[0];

  let diario=(FERMENTACIONES && Array.isArray(FERMENTACIONES.diario)) ? FERMENTACIONES.diario : [];
  let lect=diario.filter(function(x){
    return normalizarDep(x.deposito)===normalizarDep(dep) && (!lote || String(x.lote || '')===String(lote));
  }).sort(function(a,b){return valorFecha(b.fecha)-valorFecha(a.fecha);})[0];
  if(!lect) return null;
  return procesos.filter(function(p){return String(p.id)===String(lect.proceso_id);})[0] || {id:lect.proceso_id,deposito_actual:dep,lote_actual:lote};
}

function lecturasProceso(id){
  return ((FERMENTACIONES && FERMENTACIONES.diario) || [])
    .filter(function(x){return String(x.proceso_id || '')===String(id || '');})
    .sort(function(a,b){return valorFecha(a.fecha)-valorFecha(b.fecha);});
}

function numeroFerm(v){
  if(v===null || v===undefined || String(v).trim()==='') return null;
  let n=Number(String(v).replace(/\./g,'').replace(',','.'));
  return isNaN(n)?null:n;
}

function puntosEscala(valores,minY,maxY,alto,margen){
  let rango=maxY-minY || 1;
  return valores.map(function(v){return alto-margen-((v-minY)/rango)*(alto-2*margen);});
}

function svgGraficoFermentacion(proceso,modo){
  let lect=lecturasProceso(proceso.id);
  if(!lect.length) return '<div class="ferm-sin">El proceso existe, pero todavía no tiene lecturas de densidad o temperatura.</div>';
  let dens=lect.map(function(x){return numeroFerm(x.densidad);});
  let temp=lect.map(function(x){return numeroFerm(x.temperatura);});
  let hayDens=dens.some(function(x){return x!==null;});
  let hayTemp=temp.some(function(x){return x!==null;});
  if(!hayDens && !hayTemp) return '<div class="ferm-sin">Sin lecturas numéricas para representar.</div>';
  if(modo==='densidad' && !hayDens) modo='temperatura';
  if(modo==='temperatura' && !hayTemp) modo='densidad';

  let W=Math.max(650,lect.length*80),H=300,M=46;
  let xs=lect.map(function(_,i){return lect.length===1?W/2:M+i*(W-2*M)/(lect.length-1);});
  let dvals=dens.filter(function(x){return x!==null;});
  let tvals=temp.filter(function(x){return x!==null;});
  let dmin=dvals.length?Math.min.apply(null,dvals):0,dmax=dvals.length?Math.max.apply(null,dvals):1;
  let tmin=tvals.length?Math.min.apply(null,tvals):0,tmax=tvals.length?Math.max.apply(null,tvals):1;
  if(dmin===dmax){dmin-=1;dmax+=1;} if(tmin===tmax){tmin-=1;tmax+=1;}
  let dy=puntosEscala(dens.map(function(x){return x===null?dmin:x;}),dmin,dmax,H,M);
  let ty=puntosEscala(temp.map(function(x){return x===null?tmin:x;}),tmin,tmax,H,M);
  function path(vals,ys){
    let partes=[];
    vals.forEach(function(v,i){if(v!==null) partes.push((partes.length?'L':'M')+xs[i].toFixed(1)+' '+ys[i].toFixed(1));});
    return partes.join(' ');
  }
  let svg='<div class="ferm-chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de fermentación">';
  svg+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="white"/>';
  for(let g=0;g<=4;g++){let y=M+g*(H-2*M)/4;svg+='<line x1="'+M+'" y1="'+y+'" x2="'+(W-M)+'" y2="'+y+'" stroke="#e5e5e5"/>';}
  svg+='<line x1="'+M+'" y1="'+(H-M)+'" x2="'+(W-M)+'" y2="'+(H-M)+'" stroke="#666"/>';
  if((modo==='densidad'||modo==='ambas')&&hayDens){
    svg+='<path d="'+path(dens,dy)+'" fill="none" stroke="#1f4e79" stroke-width="3"/>';
    dens.forEach(function(v,i){if(v!==null)svg+='<circle cx="'+xs[i]+'" cy="'+dy[i]+'" r="4" fill="#1f4e79"><title>Densidad '+v+'</title></circle>';});
    svg+='<text x="6" y="20" font-size="12" fill="#1f4e79">Densidad '+dmin+'–'+dmax+'</text>';
  }
  if((modo==='temperatura'||modo==='ambas')&&hayTemp){
    svg+='<path d="'+path(temp,ty)+'" fill="none" stroke="#c00000" stroke-width="3"/>';
    temp.forEach(function(v,i){if(v!==null)svg+='<circle cx="'+xs[i]+'" cy="'+ty[i]+'" r="4" fill="#c00000"><title>Temperatura '+v+' °C</title></circle>';});
    svg+='<text x="'+(W-165)+'" y="20" font-size="12" fill="#c00000">Temperatura '+tmin+'–'+tmax+' °C</text>';
  }
  lect.forEach(function(x,i){
    let f=String(x.fecha||'');
    svg+='<text x="'+xs[i]+'" y="'+(H-15)+'" text-anchor="middle" font-size="10" fill="#555">'+esc(f.substring(0,5))+'</text>';
    if(x.adicion_producto || x.adicion_tipo){svg+='<polygon points="'+xs[i]+','+(M-2)+' '+(xs[i]-6)+','+(M+9)+' '+(xs[i]+6)+','+(M+9)+'" fill="#8a2be2"><title>Adición</title></polygon>';}
    if(x.descube_estado){svg+='<rect x="'+(xs[i]-5)+'" y="'+(M+13)+'" width="10" height="10" fill="#2d7dd2"><title>Descube</title></rect>';}
  });
  svg+='</svg></div>';
  return svg;
}

function eventosFermentacion(proceso){
  let eventos=[];
  lecturasProceso(proceso.id).forEach(function(x){
    if(x.adicion_producto || x.adicion_tipo || x.adicion_estado){
      eventos.push('<div class="ferm-evento"><b>'+esc(x.fecha || '-')+' · Adición</b><br>'+esc([x.adicion_tipo,x.adicion_producto,x.adicion_cantidad].filter(Boolean).join(' · ') || x.adicion_estado)+'</div>');
    }
    if(x.descube_estado){
      eventos.push('<div class="ferm-evento descube"><b>'+esc(x.fecha || '-')+' · Descube</b><br>'+esc([x.descube_estado,x.litros_descubados ? fmt(x.litros_descubados)+' L' : '',x.merma_descube ? 'Merma '+fmt(x.merma_descube)+' L' : ''].filter(Boolean).join(' · '))+'</div>');
    }
  });
  return eventos.length?'<div class="ferm-eventos">'+eventos.join('')+'</div>':'';
}

function cambiarModoGrafico(id,modo){
  MODO_GRAFICO_FERM[id]=modo;
  let cont=document.getElementById('ferm_'+String(id).replace(/[^a-zA-Z0-9_-]/g,'_'));
  if(cont){
    let p=((FERMENTACIONES.procesos||[]).filter(function(x){return String(x.id)===String(id);})[0]) || {id:id};
    cont.innerHTML=contenidoFermentacion(p);
  }
}

function contenidoFermentacion(p){
  let modo=MODO_GRAFICO_FERM[p.id] || 'ambas';
  let sid=String(p.id || '').replace(/[^a-zA-Z0-9_-]/g,'_');
  let html='<div class="ferm-panel">'+
    '<div class="ferm-meta"><b>Proceso:</b> '+esc(p.id || '-')+'<br><b>Estado:</b> '+esc(p.estado || '-')+'<br><b>Inicio:</b> '+esc(p.fecha_inicio || '-')+'<br><b>Protocolo:</b> '+esc(p.protocolo || '-')+'</div>'+
    '<div class="ferm-controls">'+
      '<button class="'+(modo==='densidad'?'active':'')+'" onclick="cambiarModoGrafico(&quot;'+esc(p.id)+'&quot;,&quot;densidad&quot;)">Densidad</button>'+
      '<button class="'+(modo==='temperatura'?'active':'')+'" onclick="cambiarModoGrafico(&quot;'+esc(p.id)+'&quot;,&quot;temperatura&quot;)">Temperatura</button>'+
      '<button class="'+(modo==='ambas'?'active':'')+'" onclick="cambiarModoGrafico(&quot;'+esc(p.id)+'&quot;,&quot;ambas&quot;)">Ambas</button>'+
    '</div>'+svgGraficoFermentacion(p,modo)+eventosFermentacion(p);
  let padres=Array.isArray(p.padres)?p.padres:[];
  if(padres.length){
    html+=bloque('Fermentaciones de origen',padres.map(function(id){
      let pp=(FERMENTACIONES.procesos||[]).filter(function(x){return String(x.id)===String(id);})[0];
      return pp?'<details class="box"><summary>'+esc(pp.id)+'</summary>'+contenidoFermentacion(pp)+'</details>':'<div class="vacio">'+esc(id)+'</div>';
    }).join(''));
  }
  html+='</div>';
  return html;
}

function bloqueFermentacion(dep,lote){
  let p=procesoPorDeposito(dep,lote);
  if(!p) return '';
  let sid=String(p.id || '').replace(/[^a-zA-Z0-9_-]/g,'_');
  return '<details class="box" open><summary>Gráfica de fermentación</summary><div id="ferm_'+sid+'">'+contenidoFermentacion(p)+'</div></details>';
}

function fichaHigiene(dep,d){
  let h = higieneDep(dep,d);

  if(!h){
    return '<div class="ficha"><b>Limpieza / aptitud:</b> Sin datos</div>';
  }

  let html = '<div class="ficha">' +
    '<b>Limpieza / aptitud:</b> '+esc(h.estado || h.texto || '-')+'<br>' +
    '<b>Fecha:</b> '+esc(h.fecha || '-')+'<br>' +
    '<b>Necesita sosa:</b> '+esc(h.necesita_sosa || '-')+'<br>' +
    '<b>Necesita desinfección:</b> '+esc(h.necesita_desinfeccion || '-')+'<br>' +
    '<b>Apto tinto:</b> '+esc(h.apto_tinto || '-')+'<br>' +
    '<b>Apto blanco/rosado:</b> '+esc(h.apto_blanco_rosado || '-')+'<br>' +
    '<b>Tipo limpieza:</b> '+esc(h.tipo_limpieza || '-')+'<br>' +
    '<b>Realizado por:</b> '+esc(h.realizado_por || '-')+'<br>' +
    '<b>Incidencia:</b> '+esc(h.incidencia || '-')+'<br>' +
    '<b>Observaciones:</b> '+esc(h.observaciones || '-')+
    '</div>';

  let hist = LIMPIEZAS_DEPOSITOS.filter(function(x){
    return String(x.dep || '').toUpperCase() === String(dep || '').toUpperCase();
  });

  html += bloque('Histórico limpieza / aptitud', pintarLista(hist,'hig'));

  return html;
}

function showDep(dep,d){
  let ok = Number(d.volumen || 0) > 0 ? 'ok' : 'warn';
  let lote = d.lote || '';

  let html = '<div class="title">'+esc(dep)+'</div>';

  html += '<div class="ficha">' +
    '<b>Fecha:</b> '+esc(d.fecha || '-')+'<br>' +
    '<b>Volumen:</b> <span class="'+ok+'">'+fmt(d.volumen)+' L</span><br>' +
    '<b>Capacidad:</b> '+fmt(d.capacidad)+' L<br>' +
    '<b>Tipo:</b> '+esc(d.tipo || '-')+'<br>' +
    '<b>Estado:</b> '+esc(d.estado || '-')+'<br>' +
    '<b>Lote actual:</b> '+esc(lote || '-')+
    '</div>';

  html += bloqueFermentacion(dep,lote);
  html += bloqueHistorialDeposito(dep,d);

  if(lote){
    html += '<details class="box"><summary>Historial del lote actual</summary>'+construirArbol(dep,lote,0,{})+'</details>';
  }

  document.getElementById('info').innerHTML = html;
}

fetch('datos.json?nocache=' + Date.now())
.then(function(r){
  return r.text();
})
.then(function(txt){
  if(txt.trim().startsWith('<')){
    throw new Error('datos.json contiene HTML, no datos JSON.');
  }

  let data = JSON.parse(txt);

  DEPOSITOS = data.depositos || {};
  MAPAS = data.mapas || [];
  MOVIMIENTOS = data.movimientos || [];
  ADICIONES = data.adiciones || [];
  ANALITICAS = data.analiticas || [];

  AUDIT_REMANENTES =
    data.audit_remanentes_destino ||
    data.AUDIT_REMANENTES_DESTINO ||
    data.remanentes_destino ||
    data.auditRemanentesDestino ||
    [];

  HIGIENE_DEPOSITOS = data.higiene_depositos || {};
  LIMPIEZAS_DEPOSITOS = data.limpiezas_depositos || [];
  RESUMEN_ANALITICAS = data.resumen_analiticas || {columnas:[], filas:[]};
  FERMENTACIONES = data.fermentaciones || {procesos:[], diario:[]};
  COLORES_TIPO_VINO = data.colores_tipo_vino || {};

  render();
  renderResumenAnaliticas();
  document.getElementById('info').innerHTML = 'Pulsa un depósito.';
})
.catch(function(e){
  document.getElementById('info').innerHTML =
    '<div class="error">No se pudo cargar datos.json<br>' + esc(e.message || e) + '</div>';
});
</script>
